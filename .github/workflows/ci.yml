# .github/workflows/ci.yml

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/pyproject.toml

      - name: Install
        run: pip install -e "./app[dev]"

      - name: Lint
        run: ruff check .
        working-directory: ./app

      # conftest.py supplies placeholder values; nothing here touches the network
      - name: Tests
        run: pytest -q
        working-directory: ./app
