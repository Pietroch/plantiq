# docker-compose.yml

name: plantiq

services:

  web:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: plantiq_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: flask --app plantiq.web.app run --host 0.0.0.0 --port 8000 --debug
    volumes:
      - ./app/src:/app/src
      - ./app/tests:/app/tests
      - ./db:/app/db
    env_file:
      - .env
